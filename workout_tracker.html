
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Workout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1117;
  --surface: #161b24;
  --surface2: #1e2535;
  --border: #2a3347;
  --accent: #3dd68c;
  --accent2: #f5a623;
  --accent3: #5b8dee;
  --red: #f05252;
  --text: #e8edf5;
  --text2: #8a95a8;
  --text3: #4a5568;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; overflow-x:hidden; }

/* HEADER */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 12px;
  position: sticky; top:0; z-index:100;
}
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.app-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px; color:var(--accent); }
.week-badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius:20px;
  padding: 5px 12px;
  font-family:'DM Mono',monospace;
  font-size:11px;
  color:var(--text2);
}
.date-pill {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius:20px;
  padding: 5px 10px;
  font-family:'DM Mono',monospace;
  font-size:11px;
  color:var(--text2);
  cursor:pointer;
  user-select:none;
  transition:all 0.15s;
}
.date-pill:active { background: var(--surface); }
.date-pill.override-active {
  background: var(--accent);
  color: #000;
  font-weight:700;
  border-color: var(--accent);
}
#wBackDateBanner {
  background: var(--accent);
  color: #000;
  padding: 8px 14px;
  font-size: 12px;
  font-family:'DM Mono',monospace;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:8px;
  border-radius:8px;
  font-weight:600;
}
#wBackDateBanner .reset-btn {
  background: rgba(0,0,0,0.15);
  border: 1px solid rgba(0,0,0,0.3);
  color:#000;
  padding:4px 10px;
  border-radius:6px;
  font-size:11px;
  cursor:pointer;
  font-weight:700;
  flex-shrink:0;
}
#wDatePickerModal[style*="display:flex"], #wDatePickerModal[style*="display: flex"] { display:flex !important; }
.day-tabs {
  display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
  scrollbar-width:none;
}
.day-tabs::-webkit-scrollbar { display:none; }
.day-tab {
  flex-shrink:0;
  padding: 7px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  font-family:'DM Mono',monospace;
  letter-spacing:0.5px;
  cursor:pointer;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  transition: all 0.2s;
  text-transform:uppercase;
}
.day-tab.active { background:var(--accent); color:#000; border-color:var(--accent); }
.day-tab.rest { opacity:0.5; }
.day-tab.today { border-color: var(--accent2); }

/* CONTENT */
.content { padding: 16px 16px 100px; max-width:520px; margin:0 auto; }

/* DAY HEADER CARD */
.day-hero {
  background: linear-gradient(135deg, var(--surface2) 0%, #1a2438 100%);
  border: 1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.day-hero::before {
  content:'';
  position:absolute; top:-30px; right:-30px;
  width:120px; height:120px;
  border-radius:50%;
  background: rgba(61,214,140,0.06);
}
.day-hero-label { font-family:'DM Mono',monospace; font-size:11px; color:var(--text2); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px; }
.day-hero-title { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:1px; color:var(--text); margin-bottom:4px; }
.day-hero-sub { font-size:13px; color:var(--text2); margin-bottom:14px; }
.day-hero-meta { display:flex; gap:10px; flex-wrap:wrap; }
.meta-chip {
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:20px;
  padding:4px 12px;
  font-size:11px;
  font-family:'DM Mono',monospace;
  color:var(--text2);
}
.meta-chip.green { border-color:rgba(61,214,140,0.4); color:var(--accent); }
.meta-chip.amber { border-color:rgba(245,166,35,0.4); color:var(--accent2); }

/* PROGRESS BAR */
.progress-wrap { margin-bottom:16px; }
.progress-label { display:flex; justify-content:space-between; font-size:12px; color:var(--text2); margin-bottom:6px; }
.progress-bar { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),#5bead4); border-radius:3px; transition:width 0.4s ease; }

/* PRE-WORKOUT BOX */
.pre-workout {
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid var(--accent2);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:16px;
}
.pre-workout h4 { font-size:12px; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:1px; color:var(--accent2); margin-bottom:8px; }
.pre-workout p { font-size:13px; color:var(--text2); line-height:1.6; }

/* SECTION LABEL */
.section-label {
  font-family:'DM Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text3);
  margin: 20px 0 10px;
}

/* EXERCISE CARD */
.exercise-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:10px;
  overflow:hidden;
  transition: border-color 0.2s;
}
.exercise-card.completed { border-color:rgba(61,214,140,0.35); }
.exercise-card.completed .ex-header { background:rgba(61,214,140,0.06); }

.ex-header {
  display:flex; align-items:center; gap:12px;
  padding:14px 16px;
  cursor:pointer;
}
.ex-check {
  width:24px; height:24px; border-radius:50%;
  border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all 0.2s;
  font-size:12px;
}
.exercise-card.completed .ex-check { background:var(--accent); border-color:var(--accent); color:#000; }
.ex-info { flex:1; }
.ex-name { font-weight:600; font-size:15px; color:var(--text); }
.ex-sets { font-size:12px; color:var(--text2); font-family:'DM Mono',monospace; margin-top:2px; }
.ex-expand { color:var(--text3); font-size:18px; transition:transform 0.2s; }
.ex-expand.open { transform:rotate(180deg); }

.ex-body { padding:0 16px 14px; display:none; }
.ex-body.open { display:block; }

/* SETS TRACKER */
.sets-tracker { margin-bottom:12px; }
.set-row {
  display:grid;
  grid-template-columns:36px 1fr 1fr 44px;
  gap:8px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--border);
}
.set-row:last-child { border-bottom:none; }
.set-num { font-family:'DM Mono',monospace; font-size:12px; color:var(--text3); text-align:center; }
.set-input {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 10px;
  font-size:14px;
  color:var(--text);
  text-align:center;
  font-family:'DM Mono',monospace;
  width:100%;
  transition:border-color 0.2s;
}
.set-input:focus { outline:none; border-color:var(--accent); }
.set-input::placeholder { color:var(--text3); font-size:12px; }
.set-done-btn {
  width:36px; height:36px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text3);
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:16px;
  transition:all 0.2s;
}
.set-done-btn.done { background:rgba(61,214,140,0.15); border-color:var(--accent); color:var(--accent); }
.set-labels {
  display:grid;
  grid-template-columns:36px 1fr 1fr 44px;
  gap:8px;
  margin-bottom:6px;
}
.set-label { font-size:10px; color:var(--text3); font-family:'DM Mono',monospace; text-align:center; text-transform:uppercase; letter-spacing:0.5px; }

.ex-note {
  background:rgba(91,141,238,0.08);
  border:1px solid rgba(91,141,238,0.2);
  border-radius:8px;
  padding:10px 12px;
  font-size:12px;
  color:#8aabf0;
  line-height:1.6;
  margin-bottom:10px;
}
.ex-tip { font-size:12px; color:var(--text2); line-height:1.6; margin-bottom:8px; }

/* REST TIMER */
.rest-timer-btn {
  display:flex; align-items:center; gap:8px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-size:13px;
  color:var(--text2);
  transition:all 0.2s;
  width:100%;
  margin-top:8px;
}
.rest-timer-btn:hover { border-color:var(--accent3); color:var(--accent3); }
.rest-timer-btn .timer-icon { font-size:16px; }

/* TIMER MODAL */
.timer-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.85);
  display:flex; align-items:center; justify-content:center;
  z-index:200;
  opacity:0; pointer-events:none;
  transition:opacity 0.2s;
}
.timer-overlay.show { opacity:1; pointer-events:all; }
.timer-modal {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:40px 36px;
  text-align:center;
  width:300px;
  transform:scale(0.9);
  transition:transform 0.2s;
}
.timer-overlay.show .timer-modal { transform:scale(1); }
.timer-label { font-family:'DM Mono',monospace; font-size:11px; color:var(--text2); letter-spacing:2px; text-transform:uppercase; margin-bottom:16px; }
.timer-display {
  font-family:'Bebas Neue',sans-serif;
  font-size:80px;
  color:var(--accent);
  line-height:1;
  margin-bottom:8px;
  letter-spacing:2px;
}
.timer-display.warning { color:var(--accent2); }
.timer-display.done { color:var(--red); }
.timer-progress-ring { margin:0 auto 20px; display:block; }
.timer-ring-bg { fill:none; stroke:var(--surface2); stroke-width:8; }
.timer-ring-fill { fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 1s linear; transform:rotate(-90deg); transform-origin:50% 50%; }
.timer-ring-fill.warning { stroke:var(--accent2); }
.timer-actions { display:flex; gap:10px; justify-content:center; }
.timer-btn {
  padding:12px 24px;
  border-radius:12px;
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.15s;
}
.timer-btn-primary { background:var(--accent); color:#000; }
.timer-btn-secondary { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }
.timer-btn:active { transform:scale(0.96); }
.timer-msg { font-size:13px; color:var(--text2); margin-top:12px; min-height:18px; }

/* WORKOUT STOPWATCH */
.stopwatch-bar {
  position:fixed;
  bottom:0; left:0; right:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:12px 20px;
  display:flex; align-items:center; justify-content:space-between;
  z-index:100;
  max-width:520px;
  margin:0 auto;
}
.sw-time {
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;
  letter-spacing:2px;
  color:var(--accent);
}
.sw-label { font-family:'DM Mono',monospace; font-size:10px; color:var(--text3); letter-spacing:1px; text-transform:uppercase; }
.sw-controls { display:flex; gap:8px; }
.sw-btn {
  padding:8px 18px;
  border-radius:10px;
  border:none;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.15s;
}
.sw-btn:active { transform:scale(0.95); }
.sw-start { background:var(--accent); color:#000; }
.sw-pause { background:var(--accent2); color:#000; }
.sw-stop { background:var(--surface2); color:var(--text2); border:1px solid var(--border); }

/* HR ZONE */
.hr-zone-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:16px;
}
.hr-zone-title { font-family:'DM Mono',monospace; font-size:11px; color:var(--text2); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:10px; }
.hr-zones { display:flex; gap:6px; }
.hr-zone {
  flex:1; border-radius:8px; padding:10px 6px; text-align:center;
  border:1px solid transparent;
}
.zone1 { background:rgba(91,141,238,0.1); border-color:rgba(91,141,238,0.2); }
.zone2 { background:rgba(61,214,140,0.1); border-color:rgba(61,214,140,0.2); }
.zone3 { background:rgba(245,166,35,0.1); border-color:rgba(245,166,35,0.2); }
.zone4 { background:rgba(240,82,82,0.1); border-color:rgba(240,82,82,0.2); }
.zone-name { font-size:10px; font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.zone1 .zone-name { color:#5b8dee; }
.zone2 .zone-name { color:var(--accent); }
.zone3 .zone-name { color:var(--accent2); }
.zone4 .zone-name { color:var(--red); }
.zone-bpm { font-size:13px; font-weight:700; color:var(--text); }
.zone-label { font-size:10px; color:var(--text2); margin-top:2px; }

/* RECOVERY SECTION */
.recovery-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-left:3px solid var(--accent3);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:10px;
}
.recovery-header { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.recovery-check {
  width:22px; height:22px; border-radius:6px;
  border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; transition:all 0.2s; font-size:11px;
}
.recovery-check.done { background:var(--accent3); border-color:var(--accent3); color:white; }
.recovery-title { font-weight:600; font-size:14px; }
.recovery-detail { font-size:13px; color:var(--text2); line-height:1.6; }

/* COMPLETE BUTTON */
.complete-workout-btn {
  width:100%;
  padding:18px;
  background:linear-gradient(135deg,var(--accent),#5bead4);
  color:#000;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:2px;
  cursor:pointer;
  margin-top:24px;
  transition:all 0.2s;
}
.complete-workout-btn:active { transform:scale(0.98); }
.complete-workout-btn:disabled { background:var(--surface2); color:var(--text3); border:1px solid var(--border); cursor:not-allowed; }

/* REST DAY */
.rest-day {
  text-align:center;
  padding:60px 20px;
}
.rest-day .rest-icon { font-size:64px; margin-bottom:20px; }
.rest-day h2 { font-family:'Bebas Neue',sans-serif; font-size:36px; letter-spacing:2px; color:var(--accent); margin-bottom:10px; }
.rest-day p { font-size:14px; color:var(--text2); line-height:1.8; max-width:300px; margin:0 auto; }

/* COMPLETE OVERLAY */
.complete-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.9);
  display:flex; align-items:center; justify-content:center;
  z-index:300;
  opacity:0; pointer-events:none;
  transition:opacity 0.3s;
}
.complete-overlay.show { opacity:1; pointer-events:all; }
.complete-modal {
  background:var(--surface);
  border:1px solid var(--accent);
  border-radius:24px;
  padding:40px 32px;
  text-align:center;
  width:320px;
  transform:scale(0.9) translateY(20px);
  transition:all 0.3s;
}
.complete-overlay.show .complete-modal { transform:scale(1) translateY(0); }
.complete-icon { font-size:56px; margin-bottom:16px; }
.complete-title { font-family:'Bebas Neue',sans-serif; font-size:42px; color:var(--accent); letter-spacing:2px; margin-bottom:8px; }
.complete-stats { display:flex; gap:16px; justify-content:center; margin:20px 0; }
.complete-stat { background:var(--surface2); border-radius:12px; padding:14px 18px; }
.complete-stat .cs-val { font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--text); }
.complete-stat .cs-label { font-size:10px; color:var(--text2); font-family:'DM Mono',monospace; text-transform:uppercase; }
.complete-summary { font-size:13px; color:var(--text2); line-height:1.7; margin-bottom:20px; }
.complete-close {
  background:var(--accent); color:#000;
  border:none; border-radius:12px;
  padding:14px 32px;
  font-size:15px; font-weight:700;
  cursor:pointer; width:100%;
}

/* NOTES AREA */
.notes-area {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  font-size:13px;
  color:var(--text);
  width:100%;
  min-height:60px;
  resize:none;
  font-family:'DM Sans',sans-serif;
  margin-top:8px;
}
.notes-area:focus { outline:none; border-color:var(--accent); }
.notes-area::placeholder { color:var(--text3); }

/* WEEK TOGGLE */
.week-toggle {
  display:flex; gap:8px; margin-bottom:14px;
}
.week-btn {
  flex:1; padding:10px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  font-size:13px;
  font-weight:600;
  color:var(--text2);
  cursor:pointer;
  transition:all 0.2s;
  font-family:'DM Mono',monospace;
}
.week-btn.active { background:var(--accent); color:#000; border-color:var(--accent); }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-top">
    <div class="app-title">⚡ WORKOUT</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="date-pill" id="wDateBadge" onclick="openWDatePicker()" title="Tap to log for a different date"></div>
      <button onclick="showSyncPanel()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:5px 10px;border-radius:20px;font-size:11px;cursor:pointer;font-family:'DM Mono',monospace">⚙ SYNC</button>
      <div class="week-badge" id="weekBadge">WEEK A</div>
    </div>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
  <div id="wBackDateBanner" style="display:none"></div>
</div>

<!-- Date picker modal -->
<div id="wDatePickerModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:340px;width:100%">
    <div style="font-family:'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--accent);font-size:18px;margin-bottom:6px">LOG FOR WHICH DATE?</div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:14px">All workout entries will use this date until you reset.</p>
    <input type="date" id="wDatePickerInput" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px;box-sizing:border-box;color:var(--text)">
    <div style="display:flex;gap:8px">
      <button onclick="closeWDatePicker()" style="flex:1;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600">Cancel</button>
      <button onclick="applyWDateOverride()" style="flex:1;background:var(--accent);border:none;color:#000;padding:10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700">Apply</button>
    </div>
  </div>
</div>

<div class="content" id="mainContent"></div>

<!-- Rest Timer Modal -->
<div class="timer-overlay" id="timerOverlay">
  <div class="timer-modal">
    <div class="timer-label">REST TIMER</div>
    <svg class="timer-progress-ring" width="120" height="120" viewBox="0 0 120 120">
      <circle class="timer-ring-bg" cx="60" cy="60" r="52"/>
      <circle class="timer-ring-fill" id="timerRingFill" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-display" id="timerDisplay">1:00</div>
    <div class="timer-msg" id="timerMsg">Rest and breathe</div>
    <div class="timer-actions">
      <button class="timer-btn timer-btn-secondary" onclick="closeTimer()">Skip</button>
      <button class="timer-btn timer-btn-primary" id="timerToggleBtn" onclick="toggleTimer()">Pause</button>
    </div>
  </div>
</div>

<!-- Complete Overlay -->
<div class="complete-overlay" id="completeOverlay">
  <div class="complete-modal">
    <div class="complete-icon">🏆</div>
    <div class="complete-title">CRUSHED IT</div>
    <div class="complete-stats" id="completeStats"></div>

// DATE OVERRIDE SYSTEM (back-date mode)
// ═══════════════════════════════════════
let wDateOverride = null;
function getActiveDate() { return wDateOverride ? new Date(wDateOverride) : new Date(); }
function getActiveDateString() { return getActiveDate().toLocaleDateString('en-US'); }
function isDateOverridden() { return wDateOverride !== null; }

function openWDatePicker() {
  const modal = document.getElementById('wDatePickerModal');
  const input = document.getElementById('wDatePickerInput');
  const d = getActiveDate();
  input.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const t = new Date();
  input.max = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  modal.style.display = 'flex';
}

function closeWDatePicker() {
  document.getElementById('wDatePickerModal').style.display = 'none';
}

function applyWDateOverride() {
  const input = document.getElementById('wDatePickerInput');
  if (!input.value) { closeWDatePicker(); return; }
  const [y, m, d] = input.value.split('-').map(Number);
  const selected = new Date(y, m-1, d);
  const today = new Date();
  today.setHours(0,0,0,0);
  selected.setHours(0,0,0,0);
  if (selected.getTime() === today.getTime()) {
    wDateOverride = null;
  } else {
    wDateOverride = selected;
    // Also auto-shift the day tab to match the override's day-of-week
    const newJsDay = selected.getDay();
    currentDayIdx = dayMap[newJsDay];
  }
  closeWDatePicker();
  updateWDateUI();
  loadState();
  renderAll();
}

function resetWDateToToday() {
  wDateOverride = null;
  // Reset day tab to actual today
  currentDayIdx = dayMap[new Date().getDay()];
  updateWDateUI();
  loadState();
  renderAll();
}

function updateWDateUI() {
  const badge = document.getElementById('wDateBadge');
  const banner = document.getElementById('wBackDateBanner');
  if (!badge) return;
  const active = getActiveDate();
  const dateStr = active.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  if (isDateOverridden()) {
    badge.textContent = '🗓 ' + dateStr;
    badge.classList.add('override-active');
    banner.style.display = 'flex';
    banner.innerHTML = `<span>⚠️ Back-dating: logging for <strong>${active.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</strong></span><button class="reset-btn" onclick="resetWDateToToday()">Reset</button>`;
  } else {
    badge.textContent = dateStr;
    badge.classList.remove('override-active');
    banner.style.display = 'none';
  }
}

// ═══════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════
function getStorageKey() {
  const d = new Date();
  return `workout_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}_${currentWeek}_${currentDayIdx}`;
}
function saveState() {
  const key = getStorageKey();
  const data = { completedExercises, recoveryDone, setData, workoutNotes, swSeconds };
  try { localStorage.setItem(key, JSON.stringify(data)); } catch(e){}
}
function loadState() {
  try {
    const key = getStorageKey();
    const saved = localStorage.getItem(key);
    if (saved) {
      const d = JSON.parse(saved);
      completedExercises = d.completedExercises || {};
      recoveryDone = d.recoveryDone || {};
      setData = d.setData || {};
      workoutNotes = d.workoutNotes || '';
      swSeconds = d.swSeconds || 0;
      updateSwDisplay();
    } else {
      completedExercises = {}; recoveryDone = {}; setData = {}; workoutNotes = ''; swSeconds = 0;
    }
  } catch(e) { completedExercises = {}; recoveryDone = {}; setData = {}; workoutNotes = ''; }
}

// Returns seconds for a timer if reps string is time-based, else null
function getRepsTimerSec(repsStr) {
  if (!repsStr) return null;
  const s = repsStr.toLowerCase();
  // Match patterns like "30 sec", "20 sec each side", "25–30 sec", "30 sec on / 30 sec rest"
  if (!s.includes('sec')) return null;
  // Extract the first number
  const match = s.match(/(\d+)/);
  if (!match) return null;
  return parseInt(match[1]);
}

function toggleExercise(bodyId) {
  const body = document.getElementById(bodyId);

  if (!body) return;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);

function toggleRecovery(key, title, icon) {
  recoveryDone[key] = !recoveryDone[key];

  if (recoveryDone[key] && getSyncUrlW()) {
    const today = getActiveDateString();
    const workout = WORKOUTS[currentWeek][getDayKey()];
    sendToSheetW('Workouts', {
      Date: today,
      Week: currentWeek,
      Day: DAY_LABELS[currentDayIdx],
      WorkoutTitle: workout ? workout.title : DAY_LABELS[currentDayIdx],

      Set: '',
      Reps: '',
      Weight: '',
      Duration: '',
      Notes: 'Recovery — Gym'

  renderAll();
}

function submitHomeSauna() {
  const btn = document.getElementById('homeSaunaBtn');
  if (btn) { btn.textContent = '⏳ Submitting...'; btn.disabled = true; }
  const today = getActiveDateString();
  const workout = WORKOUTS[currentWeek][getDayKey()];
  sendToSheetW('Workouts', {
    Date: today,
    Week: currentWeek,
    Day: DAY_LABELS[currentDayIdx],
    WorkoutTitle: workout ? workout.title : DAY_LABELS[currentDayIdx],
    Exercise: '🏠 Home Infrared Sauna',
    Set: '',
    Reps: '',
    Weight: '',
    Duration: '',
    Notes: 'Recovery — Home'
  }).then(() => {
    if (btn) { btn.textContent = '✓ Submitted'; btn.style.background = '#3dd68c'; btn.style.color = '#000'; btn.disabled = false; }
    localStorage.setItem('homeSaunaSubmitted_' + today, 'true');
  });
}

function saveSetData(exKey, setNum, field, val) {
  if (!setData[exKey]) setData[exKey] = {};
  if (!setData[exKey][setNum]) setData[exKey][setNum] = {};
  setData[exKey][setNum][field] = val;
  // Persist weight as "last used" for this exercise+set across sessions
  if (field === 'weight' && val) {
    const workout = WORKOUTS[currentWeek][getDayKey()];
    if (workout && workout.exercises) {
      const exIdx = parseInt(exKey.replace('ex_',''));
      const ex = workout.exercises[exIdx];
      if (ex) saveLastWeight(ex.name, setNum, val);
    }
  }
  saveState();
}

function getLastWeight(exName, setNum) {
  try {
    const stored = JSON.parse(localStorage.getItem('last_weights') || '{}');
    const key = exName + '_set' + setNum;
    return stored[key] || '';
  } catch(e) { return ''; }
}

function saveLastWeight(exName, setNum, weight) {
  try {
    const stored = JSON.parse(localStorage.getItem('last_weights') || '{}');
    const key = exName + '_set' + setNum;
    stored[key] = weight;
    localStorage.setItem('last_weights', JSON.stringify(stored));
  } catch(e) {}
}

function saveNotes(val) { workoutNotes = val; saveState(); }

function completeWorkout() {
  const workout = WORKOUTS[currentWeek][getDayKey()];
  const total = workout.exercises ? workout.exercises.length : 0;
  const done = Object.values(completedExercises).filter(Boolean).length;

  document.getElementById('completeSummary').textContent = `${workout.title} on ${DAY_LABELS[currentDayIdx]} (Week ${currentWeek}) logged successfully. Remember your post-workout nutrition window — eat within 45 minutes.`;

function saveSyncWorkout() {

  document.getElementById('swSyncStatus').style.color = 'var(--accent)';
}

function generateClientIdW() {
  return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}
function sleepW(ms) { return new Promise(r => setTimeout(r, ms)); }

async function postWithRetryW(url, payload, clientId, maxAttempts) {
  maxAttempts = maxAttempts || 3;
  let lastErr = null;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const response = await fetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const text = await response.text();
      try {
        const parsed = JSON.parse(text);
        if (parsed.success || parsed.deduped) {
          return { success: true, deduped: !!parsed.deduped, clientId: clientId, attempt: attempt };
        }
        lastErr = parsed.error || 'unknown_error';
      } catch(e) { lastErr = 'parse_error'; }
    } catch (corsErr) {
      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        return { success: true, unverified: true, clientId: clientId, attempt: attempt };
      } catch (e) { lastErr = e.message; }
    }
    if (attempt < maxAttempts) await sleepW(300 * attempt);
  }
  // Queue for manual retry
  try {
    const q = JSON.parse(localStorage.getItem('sync_queue')||'[]');
    q.push(payload);
    localStorage.setItem('sync_queue', JSON.stringify(q));
  } catch(err) {}
  return { success: false, queued: true, reason: lastErr, clientId: clientId };
}

async function sendToSheetW(tabName, rowData) {
  const url = getSyncUrlW();
  if (!url) return { success: false };
  const clientId = generateClientIdW();
  return await postWithRetryW(url, {
    action: 'append', tab: tabName, data: rowData,
    timestamp: new Date().toISOString(), clientId: clientId
  }, clientId);
}

async function syncSequentialW(items, statusCallback) {
  const url = getSyncUrlW();
  if (!url) return { successful: 0, failed: items.length };
  const results = [];
  let successful = 0, failed = 0;
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const clientId = generateClientIdW();
    if (statusCallback) statusCallback(i + 1, items.length);
    const result = await postWithRetryW(url, {
      action: 'append', tab: item.tab, data: item.data,
      timestamp: new Date().toISOString(), clientId: clientId
    }, clientId);
    results.push(result);
    if (result.success) successful++;
    else failed++;
    if (i < items.length - 1) await sleepW(150);
  }
  return { successful: successful, failed: failed, results: results };
}

async function testSyncWorkout() {
  const url = getSyncUrlW();
  if (!url) {
    document.getElementById('swSyncStatus').textContent = '⚠️ Save a URL first.';
    document.getElementById('swSyncStatus').style.color = 'var(--red)';
    return;
  }
  document.getElementById('swSyncStatus').textContent = 'Sending test...';
  document.getElementById('swSyncStatus').style.color = 'var(--accent2)';
  const result = await sendToSheetW('Workouts', {
    Date: getActiveDateString(),
    Week: 'TEST', Day: 'TEST',
    WorkoutTitle: 'Connection Test',
    Exercise: 'TEST_CONNECTION',
    Set: '', Reps: '', Weight: '', Duration: '',
    Notes: 'Test entry — safe to delete'
  });
  if (result.success) {
    document.getElementById('swSyncStatus').textContent = '✓ Test sent! Check the Workouts tab in your Sheet.';
    document.getElementById('swSyncStatus').style.color = 'var(--accent)';
  } else {
    document.getElementById('swSyncStatus').textContent = '⚠️ Test failed: ' + (result.reason || 'unknown');
    document.getElementById('swSyncStatus').style.color = 'var(--red)';
  }
}

// Override completeWorkout to push all set data to Google Sheets
const _origCompleteWorkout = completeWorkout;
completeWorkout = async function() {
  const workout = WORKOUTS[currentWeek][getDayKey()];
  if (!workout || !workout.exercises) { _origCompleteWorkout(); return; }
  const today = getActiveDateString();
  const duration = formatSwTime(swSeconds);

  if (getAutoSyncW() && getSyncUrlW()) {
    // Build all rows as items for sequential sync
    const items = [];
    for (let i = 0; i < workout.exercises.length; i++) {
      const ex = workout.exercises[i];
      const exKey = `ex_${i}`;
      const sets = setData[exKey] || {};
      const setCount = ex.sets || 1;
      let pushedAny = false;
      for (let s = 1; s <= setCount; s++) {
        const sd = sets[s];
        if (sd && (sd.weight || sd.reps || sd.done)) {
          items.push({ tab: 'Workouts', data: {
            Date: today, Week: currentWeek, Day: DAY_LABELS[currentDayIdx],
            WorkoutTitle: workout.title, Exercise: ex.name,
            Set: s, Reps: sd.reps || ex.reps || '', Weight: sd.weight || '',
            Duration: '', Notes: completedExercises[exKey] ? 'Completed' : ''
          }});
          pushedAny = true;
        }
      }
      if (!pushedAny && completedExercises[exKey]) {
        items.push({ tab: 'Workouts', data: {
          Date: today, Week: currentWeek, Day: DAY_LABELS[currentDayIdx],
          WorkoutTitle: workout.title, Exercise: ex.name,
          Set: '', Reps: ex.reps || '', Weight: '', Duration: '',
          Notes: 'Completed (no set data logged)'
        }});
      }
    }
    // Summary row
    items.push({ tab: 'Workouts', data: {
      Date: today, Week: currentWeek, Day: DAY_LABELS[currentDayIdx],
      WorkoutTitle: workout.title + ' [SUMMARY]',
      Exercise: '---', Set: '', Reps: '', Weight: '',
      Duration: duration, Notes: workoutNotes || ''
    }});

    const result = await syncSequentialW(items);
    if (result.failed > 0) {
      alert(`⚠️ Synced ${result.successful}/${items.length} workout rows. ${result.failed} failed. Open Sync panel to retry.`);
    }
  }

  _origCompleteWorkout();
};

// ═══════════════════════════════════════
// REST TIMER
// ═══════════════════════════════════════
// ═══════════════════════════════════════
// ALERT: VIBRATION + AUDIO TONE
// ═══════════════════════════════════════
function alertOnComplete() {
  // 1. Vibration — works on Android; inconsistent on iOS but worth trying
  try {
    if (window.navigator && navigator.vibrate) {
      navigator.vibrate([300, 100, 300, 100, 500]);
    }
  } catch(e) {}

  // 2. Audio tone — reliable on all devices including iOS
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Three short beeps
    const beepAt = (startTime, freq, duration) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.4, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.start(startTime);
      osc.stop(startTime + duration);
    };
    const t = ctx.currentTime;
    beepAt(t,       880, 0.15);
    beepAt(t + 0.2, 880, 0.15);
    beepAt(t + 0.4, 1100, 0.4);
  } catch(e) {}
}

function startTimer(seconds) {
  timerTotal = seconds;
  timerSeconds = seconds;
  timerRunning = true;
  clearInterval(timerInterval);
  document.getElementById('timerOverlay').classList.add('show');
  updateTimerDisplay();
  timerInterval = setInterval(tickTimer, 1000);
}
function tickTimer() {
  if (!timerRunning) return;
  timerSeconds--;
  if (timerSeconds <= 0) {
    timerSeconds = 0;
    timerRunning = false;
    clearInterval(timerInterval);
    document.getElementById('timerMsg').textContent = '✓ Rest complete — next set!';
    document.getElementById('timerDisplay').className = 'timer-display done';
    document.getElementById('timerToggleBtn').textContent = 'Done';
    alertOnComplete();
  }
  updateTimerDisplay();
}
function updateTimerDisplay() {
  const m = Math.floor(timerSeconds/60);
  const s = timerSeconds%60;
  document.getElementById('timerDisplay').textContent = `${m}:${String(s).padStart(2,'0')}`;
  const pct = timerSeconds/timerTotal;
  const circ = 326.7;
  document.getElementById('timerRingFill').style.strokeDashoffset = circ*(1-pct);
  if (timerSeconds <= 10 && timerSeconds > 0) {
    document.getElementById('timerDisplay').className = 'timer-display warning';
    document.getElementById('timerRingFill').className = 'timer-ring-fill warning';
    document.getElementById('timerMsg').textContent = 'Almost done...';
  } else if (timerSeconds > 10) {
    document.getElementById('timerDisplay').className = 'timer-display';
    document.getElementById('timerRingFill').className = 'timer-ring-fill';
    document.getElementById('timerMsg').textContent = 'Rest and breathe deeply';
  }
}
function toggleTimer() {
  if (timerSeconds === 0) { closeTimer(); return; }
  timerRunning = !timerRunning;
  document.getElementById('timerToggleBtn').textContent = timerRunning ? 'Pause' : 'Resume';
  if (timerRunning) { timerInterval = setInterval(tickTimer, 1000); }
  else { clearInterval(timerInterval); }
}
function closeTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  document.getElementById('timerOverlay').classList.remove('show');
  document.getElementById('timerToggleBtn').textContent = 'Pause';
  document.getElementById('timerMsg').textContent = 'Rest and breathe deeply';
}

// ═══════════════════════════════════════
// STOPWATCH
// ═══════════════════════════════════════
function formatSwTime(s) {
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function updateSwDisplay() { document.getElementById('swDisplay').textContent = formatSwTime(swSeconds); }

function toggleStopwatch() {
  swRunning = !swRunning;
  if (swRunning) {
    swInterval = setInterval(() => { swSeconds++; updateSwDisplay(); saveState(); }, 1000);
  } else {
    clearInterval(swInterval);
  }
  // Re-render to update inline start button label
  renderAll();
}

function stopStopwatch() {
  // Freeze the timer — time is locked in, won't change
  if (swRunning) {
    swRunning = false;
    clearInterval(swInterval);
    saveState();
    renderAll();
  }
}

function resetStopwatch() {
  clearInterval(swInterval); swRunning = false; swSeconds = 0;
  updateSwDisplay();
  saveState();
  renderAll();
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
loadState();
renderAll();
</script>
